name: Build Web Assets Fallback

# Keeps a compiled, working copy of the selective Bootstrap CSS/JS
# (public/css/bootstrap.min.css, public/js/bootstrap.min.js) committed to
# the repo even though this project's own deploy always rebuilds them fresh
# (see DEPLOYMENT.md) and .gitignore excludes them from normal commits.
#
# Why: public/index.html is copied wholesale by third-party self-hosters
# who may have no Node/build tooling at all — "git clone, done" needs to
# keep working. This workflow is the only thing that hand-maintains these
# two files; nobody should ever commit them manually.

on:
  push:
    branches:
      - main
    paths:
      - 'public/scss/**'
      - 'public/js-src/**'
      - 'scripts/generate-palette.js'
      - 'scripts/build-web-assets.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-web-fallback.yml'

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:web

      - name: Commit compiled fallback
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: rebuild web assets fallback [skip ci]'
          file_pattern: 'public/css/bootstrap.min.css public/js/bootstrap.min.js'
          # Both files are gitignored (this project's own deploy always
          # rebuilds them fresh) — without -f here, `git add` silently
          # skips them and this action commits nothing. Both files are
          # seeded into the repo once (in the commit that introduced this
          # workflow) specifically so git's normal "already-tracked files
          # are diffed regardless of .gitignore" behavior applies here —
          # --ignored on the dirty-check is still added as a safety net in
          # case that ever changes.
          add_options: '-f'
          status_options: '--ignored'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
