<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Event Image</title>
    <link rel="icon" href="/shared-assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/shared-assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/shared-assets/favicon-16.png">
    <link rel="apple-touch-icon" href="/shared-assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/shared-assets/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1/dist/cropper.min.css">
    <link rel="stylesheet" href="/crop-assets/crop.css">
</head>
<body>
    <div class="container py-4" style="max-width: 700px;">
        <header class="text-center mb-4">
            <h1 class="h3">🖼️ Crop Event Image</h1>
            <p class="text-secondary">Adjust the framing, then save</p>
        </header>

        <div id="loading-message">Loading...</div>

        <div id="crop-section" style="display:none;">
            <div id="crop-wrapper">
                <img id="crop-target" alt="Event image to crop">
            </div>

            <button type="button" id="save-btn" class="btn btn-success w-100 py-2 mb-4">Save Cropped Image</button>
        </div>

        <div id="empty-state" class="text-center text-secondary py-3" style="display:none;">
            <p id="empty-state-text">This request doesn't have an image yet. Add one below.</p>
        </div>

        <!-- Same two ways in as the request form: a file, or a link fetched
             by the bot. Either loads into the cropper above. -->
        <div id="source-section" style="display:none;">
            <div class="mb-3">
                <label for="source-file" class="form-label" id="source-file-label">Upload an image</label>
                <input type="file" class="form-control" id="source-file" accept="image/png,image/jpeg,image/gif,image/webp">
                <small class="form-text">PNG, JPEG, GIF, or WebP, max 8MB</small>
            </div>
            <div class="mb-3">
                <label for="source-url" class="form-label">Or Image URL</label>
                <div class="d-flex gap-2">
                    <input type="url" class="form-control" id="source-url" placeholder="https://example.com/poster.jpg">
                    <button type="button" id="fetch-url-btn" class="btn btn-secondary text-nowrap">Fetch &amp; Crop</button>
                </div>
            </div>
        </div>

        <div id="result-message" class="alert mt-3" style="display:none;"></div>
    </div>

    <script src="/shared-assets/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1/dist/cropper.min.js"></script>
    <script src="/crop-assets/crop.js"></script>
</body>
</html>
